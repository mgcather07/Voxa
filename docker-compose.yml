services:
  db:
    image: postgres:16-alpine
    container_name: voxa-db
    environment:
      POSTGRES_USER: voxa
      POSTGRES_PASSWORD: voxa
      POSTGRES_DB: voxa
    ports:
      # 5433 on the host so it never fights a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxa -d voxa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
