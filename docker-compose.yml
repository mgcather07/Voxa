services:
  db:
    image: postgres:16-alpine
    container_name: cucm-inventory-db
    environment:
      POSTGRES_USER: cucm
      POSTGRES_PASSWORD: cucm
      POSTGRES_DB: cucm_inventory
    ports:
      # 5433 on the host so it never fights a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cucm -d cucm_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
