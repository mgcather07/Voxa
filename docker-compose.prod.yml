# Production stack for a Linux VM on vSphere.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Reads secrets from .env.prod in this directory. Nothing is published to the
# host except nginx on 80/443 - Postgres and the app stay on the internal
# bridge network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    image: phone-inventory:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_HTTPS_ONLY: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    # The app must reach CUCM on 8443 and the phone subnets on 80/443.
    # If your VM needs a specific route or DNS, set it here:
    # dns:
    #   - 10.0.0.10
    #   - 10.0.0.11

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
