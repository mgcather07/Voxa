<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; {{ settings.app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">
        <div class="bars"><i></i><i></i><i></i><i></i></div>
      </div>
      <div>
        <div class="brand-name">{{ settings.app_name }}</div>
        <div class="brand-sub">Call telemetry</div>
      </div>
    </div>

    {% if error %}
    <div class="errbox" style="margin-bottom: 14px;">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" style="display:flex; flex-direction:column; gap:14px;">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:4px;">Sign in</button>
    </form>

    <p class="muted" style="font-size: 12px; margin: 18px 0 0; line-height:1.5;">
      Read-only tooling for the Cisco phone refresh. Accounts are created by an
      administrator.
    </p>
  </div>
</body>
</html>
