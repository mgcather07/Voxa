# ---------------------------------------------------------------------------
# Phone model catalog
# ---------------------------------------------------------------------------
# This file is YOURS to edit. Everything the refresh plan reports comes from
# here, so correcting a number here corrects it everywhere in the app.
#
# !! VERIFY BEFORE YOU SPEND MONEY !!
# The PoE classes and lifecycle states below are sensible working defaults,
# not gospel. Confirm each model you actually have against its Cisco data
# sheet and the End-of-Life bulletin before you hand a PoE budget or a
# purchase order to anyone. The `verified` flag is there for you to flip as
# you check each one, and the UI shows which models are still unverified.
#
# Keys are the bare model number. The app extracts that number from whatever
# CUCM calls the device ("Cisco 7962", "Cisco IP Phone 7962G", "CP-7962G" all
# resolve to 7962), so you do not need to match CUCM's string exactly.
#
# poe_class -> IEEE 802.3af/at classification. Budgeting uses the class
# ceiling, because that is what the switch actually reserves per port:
#   Class 0: 12.95 W   Class 1: 3.84 W   Class 2: 6.49 W
#   Class 3: 12.95 W   Class 4: 25.50 W (802.3at / PoE+)
# ---------------------------------------------------------------------------

poe_class_watts:
  0: 12.95
  1: 3.84
  2: 6.49
  3: 12.95
  4: 25.50

lifecycle_labels:
  eol: "End of support"
  eos: "End of sale announced"
  current: "Currently sold"
  unknown: "Unknown - verify"

# Candidate replacement platforms.
replacements:
  "9841":
    name: "Cisco Desk Phone 9841"
    poe_class: 3
    role: "Standard desk phone"
    requires: "CUCM 14SU3+ or 15 with current device pack"
  "9851":
    name: "Cisco Desk Phone 9851"
    poe_class: 4
    role: "Executive / multi-line, larger display"
    requires: "CUCM 14SU3+ or 15 with current device pack"
  "9871":
    name: "Cisco Desk Phone 9871"
    poe_class: 4
    role: "Executive touchscreen"
    requires: "CUCM 14SU3+ or 15 with current device pack"
  "8875":
    name: "Cisco Video Phone 8875"
    poe_class: 4
    role: "Video desk phone"
    requires: "CUCM 14SU3+ or 15 with current device pack"
  "8832":
    name: "Cisco IP Conference Phone 8832"
    poe_class: 4
    role: "Conference room"
    requires: "PoE+ or the Cisco power injector"
  "8821":
    name: "Cisco Wireless IP Phone 8821"
    poe_class: 0
    role: "Wireless handset (no PoE - charger cradle)"
    requires: "Validated 802.11 wireless coverage"
  "8841":
    name: "Cisco IP Phone 8841"
    poe_class: 2
    role: "Standard desk phone (previous generation, still deployable)"
    requires: "CUCM 10.5+"

  "9811":
    name: "Cisco Desk Phone 9811"
    poe_class: 2
    role: "Entry-level desk phone"
    requires: "CUCM 14SU3+ or 15 with current device pack"

