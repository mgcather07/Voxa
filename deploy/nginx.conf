# Reverse proxy for the phone inventory app.
#
# Expects a certificate pair at deploy/certs/. Use your internal CA - a cert
# your AD-joined workstations already trust means no browser warnings:
#
#   openssl req -new -newkey rsa:2048 -nodes \
#     -keyout deploy/certs/server.key -out deploy/certs/server.csr \
#     -subj "/CN=phones.corp.example.com"
#
# Submit the CSR to your CA, save the issued cert as deploy/certs/server.crt
# (append the intermediate chain to it), then restart nginx.

server {
    listen 80;
    server_name _;
    # Everything goes over TLS. The session cookie is marked Secure.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # A full CSV export of a large cluster is a few MB.
    client_max_body_size 8m;

    # A first collection against a big cluster can run for several minutes.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /health {
        proxy_pass http://app:8000/health;
        access_log off;
    }

    location /static/ {
        proxy_pass http://app:8000/static/;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
